<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}PersoPyro Yönetim Paneli{% endblock %}</title>
  <style>
    :root {
      --fg: #0f172a; --fg-soft: #334155; --muted: #64748b;
      --bg: #f4f6fb; --card: #fff; --line: #e5e9f0; --line-strong: #cfd7e3;
      --accent: #2563eb; --accent-dark: #1d4ed8; --accent-soft: #eff4ff;
      --ok: #15803d; --ok-soft: #ecfdf3; --warn: #b45309; --warn-soft: #fffaeb;
      --err: #b42318; --err-soft: #fef3f2; --dev: #6d28d9; --dev-soft: #f5f3ff;
      --r: 12px; --r-sm: 9px; --r-lg: 16px; --gap: 16px; --pad: 18px;
      --page-max: 1400px; --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
      --shadow: 0 1px 3px rgba(16, 24, 40, .07), 0 10px 28px -14px rgba(16, 24, 40, .22);
      --ring: 0 0 0 3px rgba(37, 99, 235, .18);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; }
    a { color: var(--accent-dark); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center;
      gap: 16px; min-height: 64px; padding: 10px max(20px, calc((100vw - var(--page-max)) / 2));
      background: rgba(255,255,255,.94); border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow-sm); backdrop-filter: saturate(180%) blur(10px); }
    .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--fg);
      font-size: 15px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
    .brand:hover { text-decoration: none; }
    .brand-mark { display: inline-grid; place-items: center; width: 28px; height: 28px;
      border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--dev));
      color: #fff; font-size: 14px; }
    .brand-tag { color: var(--muted); font-size: 12px; font-weight: 500; }
    .header-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .user-email { color: var(--muted); font-size: 13px; }
    .page-container { width: min(100%, var(--page-max)); margin: 24px auto;
      padding: 0 20px 52px; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between;
      gap: 16px; margin: 0 0 18px; }
    .page-heading h1 { margin: 0; font-size: 24px; letter-spacing: -.025em; }
    .page-heading p { margin: 4px 0 0; color: var(--muted); }
    .eyebrow { color: var(--accent-dark) !important; font-size: 11px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase; }
    .card { margin-bottom: var(--gap); padding: var(--pad) calc(var(--pad) + 2px);
      border: 1px solid var(--line); border-radius: var(--r); background: var(--card);
      box-shadow: var(--shadow-sm); }
    .card h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
    .card-intro { margin: 4px 0 16px; color: var(--muted); }
    .section-head { display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px 16px; align-items: end; }
    .field label { display: block; margin: 0 0 5px; color: var(--fg-soft);
      font-size: 12.5px; font-weight: 600; }
    input, select, textarea { width: 100%; min-height: 40px; padding: 8px 11px;
      border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: #fff;
      color: var(--fg); font: inherit; transition: border-color .12s, box-shadow .12s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent);
      box-shadow: var(--ring); }
    input::placeholder { color: #9aa8ba; }
    button, .button { display: inline-flex; justify-content: center; align-items: center;
      min-height: 38px; padding: 7px 13px; border: 1px solid var(--line-strong);
      border-radius: var(--r-sm); background: #fff; color: var(--fg); font: inherit;
      font-weight: 600; cursor: pointer; box-shadow: var(--shadow-sm); }
    button:hover, .button:hover { background: #f8fafc; text-decoration: none; }
    button.primary, .button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    button.primary:hover, .button.primary:hover { border-color: var(--accent-dark); background: var(--accent-dark); }
    button.ghost, .button.ghost { border-color: transparent; background: transparent; box-shadow: none; }
    button:focus-visible, .button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .subsection-title { grid-column: 1 / -1; margin: 8px 0 -4px; padding-top: 12px;
      border-top: 1px dashed var(--line-strong); color: var(--muted); font-size: 12px;
      font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-top: 4px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
    table { width: 100%; border-collapse: collapse; background: var(--card); }
    th, td { padding: 10px 12px; border-bottom: 1px solid #eef1f6; text-align: left;
      vertical-align: middle; }
    th { background: #f8fafc; color: var(--muted); font-size: 11.5px; font-weight: 700;
      letter-spacing: .055em; text-transform: uppercase; white-space: nowrap; }
    tbody tr:hover { background: #fafcff; }
    tbody tr:last-child td { border-bottom: 0; }
    .row-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .row-actions form { display: flex; align-items: center; gap: 6px; }
    .row-actions input[type="date"] { width: 145px; min-width: 145px; }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 20px; }
    .detail-grid dd { margin: 2px 0 0; }
    .field-span { grid-column: 1 / -1; }
    fieldset.field { min-width: 0; margin: 0; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); }
    fieldset.field legend { padding: 0 5px; color: var(--fg-soft); font-size: 12.5px; font-weight: 600; }
    .check-field { display: inline-flex; align-items: center; gap: 6px; margin: 5px 12px 5px 0; }
    .check-field input { width: auto; min-height: auto; }
    .company-form-section { min-width:0; padding:18px; border:1px solid var(--line); border-radius:var(--r); background:#fbfcfe; }
    .company-form-section > h3 { margin:0 0 14px; color:var(--fg); font-size:15px; }
    .company-form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 18px; }
    .custom-company-field { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 16px; align-items:end; padding:16px; margin:12px 0; border:1px solid var(--line-strong); border-radius:var(--r-sm); background:#fff; }
    .custom-company-field > label { display:block; margin:0; color:var(--fg-soft); font-size:12.5px; font-weight:600; }
    .custom-company-field > label input, .custom-company-field > label select,
    .custom-company-field > label textarea { display:block; margin-top:5px; }
    .custom-company-field > button { justify-self:start; }
    .company-profile-row { display:flex; min-width:0; flex-direction:column; align-items:stretch; gap:5px; }
    .company-profile-row label { display:block; margin:0; color:var(--fg-soft); font-size:12.5px; font-weight:600; }
    .company-profile-row input[type="checkbox"] { width:auto; min-height:auto; }
    .panel-tabs { display:flex; gap:8px; margin-bottom:18px; border-bottom:1px solid var(--line); }
    .panel-tabs a { padding:10px 14px; color:var(--fg-soft); border-bottom:2px solid transparent; font-weight:650; }
    .panel-tabs a.selected { color:var(--accent-dark); border-color:var(--accent); }
    .decision-form { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .decision-form input { grid-column: 1 / -1; min-width: 180px; }
    .decision-form button { padding-inline: 8px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .badge { display: inline-flex; align-items: center; padding: 3px 9px;
      border: 1px solid var(--line); border-radius: 999px; background: #f8fafc;
      color: var(--fg-soft); font-size: 12px; font-weight: 650; white-space: nowrap; }
    .badge.ok { border-color: #b7e4c7; background: var(--ok-soft); color: var(--ok); }
    .badge.warn { border-color: #f4d7a2; background: var(--warn-soft); color: var(--warn); }
    .badge.muted { color: var(--muted); }
    .muted { color: var(--muted); }
    .empty-state { padding: 28px 16px; color: var(--muted); text-align: center; }
    .auth-page .page-container { display: grid; min-height: calc(100vh - 64px);
      place-items: center; }
    .auth-card { width: min(100%, 440px); padding: 28px; box-shadow: var(--shadow); }
    .auth-card h1 { margin: 0; font-size: 22px; }
    .auth-card .field { margin-top: 16px; }
    .auth-card button { width: 100%; margin-top: 20px; }
    .error { margin: 14px 0 0; padding: 10px 12px; border-radius: var(--r-sm);
      background: var(--err-soft); color: var(--err); }
    details { max-width: 32rem; }
    dt { margin-top: .5rem; font-weight: 650; }
    dd { margin-left: 0; overflow-wrap: anywhere; }
    @media (max-width: 700px) {
      .topbar { padding-inline: 14px; }
      .page-container { margin-top: 18px; padding-inline: 14px; }
      .page-heading { align-items: flex-start; flex-direction: column; }
      .user-email { display: none; }
      .card { padding: 15px; }
      .company-form-grid, .custom-company-field { grid-template-columns:1fr; }
      table { min-width: 680px; }
    }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="{% url 'platform-dashboard' %}">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span>PersoPyro</span><span class="brand-tag">Yönetim paneli</span>
    </a>
    <div class="header-actions">{% block header_actions %}{% endblock %}</div>
  </header>
  <main class="page-container {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
