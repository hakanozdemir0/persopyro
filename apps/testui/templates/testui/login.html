{% extends "testui/base.html" %}
{% block title %}Giriş — Persopyro manuel test{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="card">
    <h1>Giriş</h1>
    <form id="login-form">
      <label for="tenant">Kiracı (slug)</label>
      <input id="tenant" name="tenant" value="demo" autocomplete="organization" required>

      <label for="email">E-posta</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Parola</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <p><button class="primary" type="submit">Giriş yap</button></p>
    </form>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
  const form = document.getElementById("login-form");
  form.addEventListener("submit", async (olay) => {
    olay.preventDefault();
    const govde = {
      tenant: document.getElementById("tenant").value.trim(),
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
    };
    try {
      await PERSOPYRO_UI.cagir("/api/v1/auth/login", {
        method: "POST", body: govde, onayGerekli: false,
      });
      window.location.href = "/test-ui/";
    } catch (hata) {
      PERSOPYRO_UI.mesaj("error", hata.message);
    }
  });
</script>
{% endblock %}
