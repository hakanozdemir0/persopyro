{% extends "testui/base.html" %}
{% block title %}Panel — Persopyro manuel test{% endblock %}

{% block tabs %}
<div class="tabs">
  <button data-tab="panel" class="active">Panel</button>
  <button data-tab="departments">Departmanlar</button>
  <button data-tab="employees">Çalışanlar</button>
  <button data-tab="leave">İzin Talebi</button>
  <button data-tab="approvals">Onaylar</button>
  <button data-tab="raw">Yetki Yönetimi</button>
</div>
{% endblock %}

{% block content %}

<section id="tab-panel" class="tab"></section>
<section id="tab-departments" class="tab" hidden></section>
<section id="tab-employees" class="tab" hidden></section>
<section id="tab-leave" class="tab" hidden></section>
<section id="tab-approvals" class="tab" hidden></section>
<section id="tab-raw" class="tab" hidden></section>

<div id="modal" class="modal-backdrop" hidden>
  <div class="modal card">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" type="button">Vazgeç</button>
      <button id="modal-ok" class="primary" type="button">Onayla</button>
    </div>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
  const esc = (d) => String(d === null || d === undefined ? "" : d)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
  const bos = (d) => JSON.stringify(d, null, 2);
  const yok = '<span class="muted">—</span>';
  let ME = null;      // /api/me
  let LOOKUPS = null; // /lookups
  let EMPLOYEES = []; // kapsamdaki çalışanlar
  let TREE = [];      // departman ağacı

  const durumPill = (durum, etiket) =>
    `<span class="pill ${esc(durum)}">${esc(etiket || durum)}${etiket ? " · " + esc(durum) : ""}</span>`;

  // Yıllık izin özeti (değerler backend'den; arayüz hesap yapmaz).
  const yillikSatir = (y) => y.hakedis_var
    ? `<span class="hakedis">Yıllık izin: <strong>${esc(y.entitled_days)}</strong> gün ·
         Kullanılan: <strong>${esc(y.used_days)}</strong> ·
         Bekleyen: <strong>${esc(y.reserved_days)}</strong> ·
         Kalan: <strong>${esc(y.available_days)}</strong></span>`
    : `<span class="muted">${esc(y.mesaj || "Henüz yıllık izin hakedişi oluşturulmamış.")}</span>`;

  function onayModali(baslik, govdeHtml, onayMetni = "Onayla") {
    return new Promise((cozumle) => {
      const kapak = document.getElementById("modal");
      document.getElementById("modal-title").textContent = baslik;
      document.getElementById("modal-body").innerHTML = govdeHtml;
      const okBtn = document.getElementById("modal-ok");
      const iptalBtn = document.getElementById("modal-cancel");
      okBtn.textContent = onayMetni;
      kapak.hidden = false;
      const temizle = () => {
        kapak.hidden = true;
        okBtn.onclick = null;
        iptalBtn.onclick = null;
      };
      okBtn.onclick = () => { temizle(); cozumle(true); };
      iptalBtn.onclick = () => { temizle(); cozumle(false); };
    });
  }

  function lookupSecenekler(liste, secili = "") {
    return [`<option value="">(seçiniz)</option>`]
      .concat(liste.map((x) => `<option value="${esc(x.id)}"${x.id === secili ? " selected" : ""}>${esc(x.name)}</option>`))
      .join("");
  }

  // --- Panel ---------------------------------------------------------------
  async function yuklePanel() {
    const { data } = await PERSOPYRO_UI.cagir("/test-ui/api/dashboard");
    const k = ME.data;
    const calisan = data.employee;

    const bakiyeler = data.balances.length
      ? `<table><thead><tr><th>Tür</th><th>Dönem</th><th>Hakediş</th><th>Devreden</th>
         <th>Düzeltme</th><th>Kullanılan</th><th>Bekleyen</th><th>Kalan</th></tr></thead><tbody>
         ${data.balances.map((b) => `<tr><td>${esc(b.leave_type)} <span class="muted">(${esc(b.leave_type_code)})</span></td>
           <td>${esc(b.period_year)}</td><td>${esc(b.entitled_days)}</td><td>${esc(b.carried_forward_days)}</td>
           <td>${esc(b.adjustment_days)}</td><td>${esc(b.used_days)}</td><td>${esc(b.reserved_days)}</td>
           <td><strong>${esc(b.available_days)}</strong></td></tr>`).join("")}
         </tbody></table>`
      : `<p class="muted">Balans kullanan izin türü için bakiye kaydı yok.</p>`;

    const talepler = data.my_requests.length
      ? `<table><thead><tr><th>Tür</th><th>Tarih</th><th>Gün</th><th>Durum</th><th>Aşama</th><th></th></tr></thead><tbody>
         ${data.my_requests.map((t) => `<tr><td>${esc(t.leave_type)}</td>
           <td>${esc(t.start_date)} → ${esc(t.end_date)}</td><td>${esc(t.days_requested)}</td>
           <td>${durumPill(t.status, t.status_label)}</td>
           <td>${t.current_step_no ? "adım " + esc(t.current_step_no) : "—"}</td>
           <td>${t.can_cancel ? `<button data-cancel="${esc(t.id)}">İptal et</button>` : ""}</td></tr>`).join("")}
         </tbody></table>`
      : `<p class="muted">Henüz talebiniz yok.</p>`;

    document.getElementById("tab-panel").innerHTML = `
      <div class="card">
        <h1>Panel</h1>
        <div class="grid">
          <div><h3>Kullanıcı</h3>${esc(k.user.name || k.user.email)}<br>
            <span class="muted">${esc(k.user.email)}</span></div>
          <div><h3>Kiracı</h3>${esc(k.tenant.name)}</div>
          <div><h3>Roller</h3>${k.roles.map((r) => `<span class="pill">${esc(r.name)}</span>`).join(" ") || yok}
            <div class="muted small">${k.roles.map((r) => esc(r.code)).join(", ")}</div></div>
          <div><h3>Organizasyon kapsamı</h3>
            ${k.scope.tenant_wide ? "Tüm kiracı" : (k.scope.unit_count ? k.scope.unit_count + " birim + alt birimleri" : "Yalnızca kendi kaydı")}
          </div>
          <div><h3>Unvan / Birim</h3>${calisan
            ? `${esc(calisan.position) || yok}<br><span class="muted">${esc(calisan.department) || ""}</span>`
            : "<span class='muted'>bağlı çalışan kaydı yok</span>"}</div>
          <div><h3>Yönetici</h3>${calisan && calisan.manager
            ? esc(calisan.manager.employee_no) + (calisan.manager.name ? " · " + esc(calisan.manager.name) : "")
            : yok}</div>
        </div>
      </div>
      <div class="card"><h2>Yıllık izin bakiyem (${esc(data.period_year)})</h2>
        <p class="hakedis-buyuk">${yillikSatir(data.annual)}</p>
        <p class="muted">Kalan gün <strong>backend'de üretilen</strong> kolondan gelir; arayüz hesap yapmaz.</p>
        ${bakiyeler}
      </div>
      <div class="card"><h2>Yaklaşan izinler (kapsamınızdaki onaylı talepler)</h2>
        ${data.upcoming_requests.length
          ? `<table><thead><tr><th>Çalışan</th><th>Birim</th><th>Tür</th><th>Başlangıç</th>
             <th>Bitiş</th><th>Gün</th></tr></thead><tbody>
             ${data.upcoming_requests.map((t) => `<tr><td>${esc(t.employee_no)}</td>
               <td>${esc(t.department)}</td><td>${esc(t.leave_type)}</td>
               <td>${esc(t.start_date)}</td><td>${esc(t.end_date)}</td>
               <td>${esc(t.days_requested)}</td></tr>`).join("")}
             </tbody></table>`
          : `<p class="muted">Yaklaşan onaylı izin yok.</p>`}
      </div>
      <div class="card"><h2>Karara bağlanan izinler</h2>
        <p class="muted">Durum sayıları (kapsamınız içinde): onay bekleyen
          <strong>${esc(data.status_counts.pending)}</strong> ·
          onaylanan <strong>${esc(data.status_counts.approved)}</strong> ·
          reddedilen <strong>${esc(data.status_counts.rejected)}</strong> ·
          iptal <strong>${esc(data.status_counts.canceled)}</strong></p>
        ${data.decided_requests.length
          ? `<table><thead><tr><th>Çalışan</th><th>Birim</th><th>Tür</th><th>Tarih</th>
             <th>Gün</th><th>Durum</th><th>Karar</th></tr></thead><tbody>
             ${data.decided_requests.map((t) => `<tr><td>${esc(t.employee_no)}</td>
               <td>${esc(t.department)}</td><td>${esc(t.leave_type)}</td>
               <td>${esc(t.start_date)} → ${esc(t.end_date)}</td><td>${esc(t.days_requested)}</td>
               <td>${durumPill(t.status, t.status_label)}</td>
               <td>${esc(t.decided_at ? t.decided_at.slice(0, 10) : "")}</td></tr>`).join("")}
             </tbody></table>`
          : `<p class="muted">Henüz karara bağlanmış izin talebi yok.</p>`}
      </div>
      <div class="card"><h2>İzin taleplerim</h2>${talepler}</div>
      <div class="card"><h2>Onayımı bekleyen talepler (${esc(data.pending_count)})</h2>
        ${data.pending_requests.length ? data.pending_requests.map((t) => `
          <div class="row" style="border-bottom:1px solid var(--line); padding:8px 0">
            <div>${esc(t.employee_no)} · ${esc(t.department)}</div>
            <div>${esc(t.leave_type)}</div>
            <div>${esc(t.start_date)} → ${esc(t.end_date)} (${esc(t.days_requested)} gün)</div>
            <div>${durumPill(t.status, t.status_label)}</div>
            <div>${t.can_approve ? `<button class="primary" data-approve="${esc(t.id)}">Onayla</button>` : "<span class='muted'>yetki yok</span>"}</div>
          </div>`).join("") : "<p class='muted'>Onayınızı bekleyen talep yok.</p>"}
      </div>`;
    document.querySelectorAll("[data-cancel]").forEach((d) =>
      d.addEventListener("click", () => iptalEt(d.dataset.cancel)));
    document.querySelectorAll("[data-approve]").forEach((d) =>
      d.addEventListener("click", () => karar(d.dataset.approve, "approved")));
  }

  async function iptalEt(id) {
    const neden = prompt("İptal gerekçesi (en az 5 karakter):");
    if (!neden) return;
    try {
      await PERSOPYRO_UI.cagir(`/test-ui/api/leave-requests/${id}/cancel`,
        { method: "POST", body: { reason: neden } });
      PERSOPYRO_UI.mesaj("ok", "Talep iptal edildi.");
      await Promise.all([yuklePanel(), yukleOnaylar()]);
    } catch (hata) { PERSOPYRO_UI.mesaj("error", hata.message); }
  }

  async function karar(id, kararTipi) {
    let neden = "";
    if (kararTipi === "rejected") {
      neden = prompt("Red gerekçesi:");
      if (!neden) return;
    }
    try {
      await PERSOPYRO_UI.cagir(`/test-ui/api/leave-requests/${id}/decision`,
        { method: "POST", body: { decision: kararTipi, reason: neden } });
      PERSOPYRO_UI.mesaj("ok", kararTipi === "approved" ? "Talep onaylandı." : "Talep reddedildi.");
      // Bakiye görünümü backend'den yeniden çekilir (onay/red sonrası güncel değer).
      await Promise.all([yuklePanel(), yukleOnaylar(), yukleCalisanlar()]);
    } catch (hata) { PERSOPYRO_UI.mesaj("error", hata.message); }
  }

  // --- Departmanlar --------------------------------------------------------
  async function yukleDepartmanlar() {
    const { data, meta } = await PERSOPYRO_UI.cagir("/test-ui/api/departments");
    TREE = data;
    const cocuklar = (parentId) => data.filter((d) => d.parent_id === parentId);
    const dal = (parentId) => {
      const alt = cocuklar(parentId);
      if (!alt.length) return "";
      return `<ul>${alt.map((d) => `<li>
        <strong>${esc(d.name)}</strong> <span class="muted">(${esc(d.code)})</span>
        <span class="muted">${esc(d.employee_count)} çalışan${d.manager_employee_no ? " · sorumlu " + esc(d.manager_employee_no) : ""}</span>
        ${meta.can_manage ? `
          <button data-adlandir="${esc(d.id)}">Düzenle</button>
          <button data-move="${esc(d.id)}">Taşı</button>
          <button class="danger" data-del="${esc(d.id)}">Sil</button>` : ""}
        ${dal(d.id)}</li>`).join("")}</ul>`;
    };
    document.getElementById("tab-departments").innerHTML = `
      <div class="card"><h1>Departmanlar</h1>
        <p class="muted">Ağaç <strong>adjacency list</strong> üzerinden gelir (OD24).
          Yetki kararı servis katmanında, döngü/derinlik/kiracı garantileri veritabanında verilir.</p>
        <div class="tree"><ul>${dal(null)}</ul></div>
      </div>
      <div class="card"><h2>Yeni departman</h2>
        ${meta.can_manage ? `
        <div class="row">
          <div><label>Kod</label><input id="dep-code" placeholder="ORNEK"></div>
          <div><label>Ad</label><input id="dep-name" placeholder="Örnek Birim"></div>
          <div><label>Üst birim</label><select id="dep-parent">${lookupSecenekler(data, "")}</select></div>
          <div><button class="primary" id="dep-create">Oluştur</button></div>
        </div>` : `<p class="muted">Yetkiniz yok: <code>org.department.manage</code> izni ve kapsam gerekir.</p>`}
      </div>`;

    const olustur = document.getElementById("dep-create");
    if (olustur) olustur.addEventListener("click", async () => {
      try {
        await PERSOPYRO_UI.cagir("/test-ui/api/departments", { method: "POST", body: {
          code: document.getElementById("dep-code").value.trim(),
          name: document.getElementById("dep-name").value.trim(),
          parent_id: document.getElementById("dep-parent").value || null,
        }});
        PERSOPYRO_UI.mesaj("ok", "Departman oluşturuldu.");
        await yukleDepartmanlar();
      } catch (hata) { PERSOPYRO_UI.mesaj("error", hata.message); }
    });

    document.querySelectorAll("[data-adlandir]").forEach((d) =>
      d.addEventListener("click", () => adlandirmaEkrani(d.dataset.adlandir)));
    document.querySelectorAll("[data-move]").forEach((d) =>
      d.addEventListener("click", () => tasimaEkrani(d.dataset.move)));
    document.querySelectorAll("[data-del]").forEach((d) =>
      d.addEventListener("click", () => silmeEkrani(d.dataset.del)));
  }

  // Birim adı/kodu değiştirme (OD21: silme değil; `update_department` servisi).
  async function adlandirmaEkrani(birimId) {
    const birim = TREE.find((d) => d.id === birimId);
    if (!birim) { PERSOPYRO_UI.mesaj("error", "Birim bulunamadı."); return; }
    const onay = await onayModali("Birimi düzenle",
      `<p><strong>${esc(birim.name)}</strong> (${esc(birim.code)})</p>
       <label>Yeni ad</label><input id="dep-yeni-ad" value="${esc(birim.name)}">
       <label>Yeni kod</label><input id="dep-yeni-kod" value="${esc(birim.code)}">
       <label>Gerekçe (opsiyonel)</label><input id="dep-yeni-gerekce" placeholder="Örn. yazım düzeltmesi">
       <p class="muted small">Kod/ad değişikliği denetim kaydına yazılır; kapsam ve ağaç etkilenmez.</p>`,
      "Kaydet");
    if (!onay) return;
    try {
      await PERSOPYRO_UI.cagir(`/test-ui/api/departments/${birimId}/update`, {
        method: "POST",
        body: {
          name: document.getElementById("dep-yeni-ad").value.trim(),
          code: document.getElementById("dep-yeni-kod").value.trim(),
          reason: document.getElementById("dep-yeni-gerekce").value.trim(),
        },
      });
      PERSOPYRO_UI.mesaj("ok", "Birim güncellendi.");
      await Promise.all([yukleDepartmanlar(), yukleCalisanlar()]);
    } catch (hata) { PERSOPYRO_UI.mesaj("error", hata.message); }
  }

  // Madde 4: taşıma artık görsel seçim — hedef listesi backend'den (kendisi ve alt
  // ağacı **hariç**), onay metni okunabilir, sonrasında ağaç otomatik yenilenir.
  async function tasimaEkrani(birimId) {
    let veri;
    try {
      veri = await PERSOPYRO_UI.cagir(`/test-ui/api/departments?moves_for=${birimId}`);
    } catch (hata) { PERSOPYRO_UI.mesaj("error", hata.message); return; }
    const birim = veri.data.find((d) => d.id === birimId);
    if (!birim) { PERSOPYRO_UI.mesaj("error", "Birim bulunamadı."); return; }
    const suanki = birim.parent_id
      ? (veri.data.find((d) => d.id === birim.parent_id) || {}).name || "—"
      : "en üst seviye";
    const secenekler = (veri.meta.move_options || [])
      .map((h) => `<option value="${esc(h.id)}">${esc(h.name)} (${esc(h.code)})</option>`)
      .join("");
    const govde = `
      <p><strong>Taşınacak birim:</strong> ${esc(birim.name)} (${esc(birim.code)})</p>
      <p class="muted">Şu anki üst birim: ${esc(suanki)}</p>
      <label>Yeni üst birim</label>
      <select id="move-hedef">
        <option value="">En üst seviyeye taşı (kök)</option>
        ${secenekler}
      </select>
      <label>Gerekçe (opsiyonel)</label>
      <input id="move-gerekce" placeholder="Örn. yeniden yapılanma">
      <p class="muted small">Kendi biriminiz ve alt birimleri listede yer almaz; güvenlik
        bununla sınırlı değildir — sunucu döngü/derinlik/kiracı garantilerini uygular.</p>`;
    const onay = await onayModali("Birimi taşı", govde, "Taşı");
    if (!onay) return;
    const hedefId = document.getElementById("move-hedef").value || null;
    const gerekce = (document.getElementById("move-gerekce").value || "").trim();
    const hedefAd = hedefId
      ? ((veri.meta.move_options || []).find((h) => h.id === hedefId) || {}).name
      : "en üst seviye";
    const emin = await onayModali(
      "Taşımayı onayla",
      `<p><strong>${esc(birim.name)}</strong> birimini <strong>${esc(hedefAd)}</strong> altına
        taşımak istiyor musunuz?</p>`,
      "Evet, taşı",
    );
    if (!emin) return;
    try {
      await PERSOPYRO_UI.cagir(`/test-ui/api/departments/${birimId}/move`, {
        method: "POST",
        body: { parent_id: hedefId, reason: gerekce || "test arayüzü taşıma" },
      });
      PERSOPYRO_UI.mesaj("ok", `${birim.name} taşındı; kapsam yeni ağaca göre hesaplanır.`);
      await Promise.all([yukleDepartmanlar(), yukleCalisanlar()]);
    } catch (hata) { PERSOPYRO_UI.mesaj("error", hata.message); }
  }

  async function silmeEkrani(birimId) {
    const birim = TREE.find((d) => d.id === birimId);
    const onay = await onayModali(
      "Birimi sil",
      `<p><strong>${esc((birim || {}).name || "")}</strong> birimini silmek (soft delete) istiyor
        musunuz? Aktif çalışanı veya alt birimi olan birim silinemez.</p>
       <label>Gerekçe</label><input id="sil-gerekce" placeholder="Örn. birleştirme">`,
      "Sil",
    );
    if (!onay) return;
    try {
      await PERSOPYRO_UI.cagir(`/test-ui/api/departments/${birimId}/delete`, {
        method: "POST", body: { reason: "test arayüzü silme" }});
      PERSOPYRO_UI.mesaj("ok", "Birim silindi (OD21 soft delete).");
      await yukleDepartmanlar();
    } catch (hata) { PERSOPYRO_UI.mesaj("error", hata.message); }
  }

  // --- Çalışanlar ----------------------------------------------------------
  async function yukleCalisanlar() {
    const { data, meta } = await PERSOPYRO_UI.cagir("/test-ui/api/employees");
    EMPLOYEES = data;
    document.getElementById("tab-employees").innerHTML = `
      <div class="card"><h1>Çalışanlar</h1>
        <p class="muted">Yalnızca <strong>kapsamınızdaki</strong> çalışanlar listelenir
          (tüm kiracı / birim + alt birimleri / yalnızca kendisi). Kişisel veri (K2/K3) gösterilmez.</p>
        <table><thead><tr><th>No</th><th>Çalışan</th><th>Birim</th><th>Unvan</th>
          <th>Rol</th><th>Yıllık izin (hak / kullanılan / bekleyen / kalan)</th><th>Durum</th><th></th></tr></thead><tbody>
          ${data.map((c) => `<tr>
            <td>${esc(c.employee_no)}</td>
            <td>${esc(c.user_name) || c.user_email ? esc(c.user_name || c.user_email) : "<span class='muted'>kullanıcı bağlı değil</span>"}
              <div class="muted small">${esc(c.user_email || "")}</div></td>
            <td>${esc(c.department) || yok}</td>
            <td>${esc(c.position) || yok}</td>
            <td>${c.roles.length ? c.roles.map((r) => `<span class="pill">${esc(r.name)}</span>`).join(" ") : yok}</td>
            <td>${yillikSatir(c.annual)}</td>
            <td>${esc(c.status_label || c.status)}</td>
            <td><button data-detay="${esc(c.id)}">Detay</button></td></tr>`).join("")}
        </tbody></table>
        <div id="employee-detail"></div>
      </div>
      <div class="card"><h2>Yeni çalışan</h2>
        ${meta.can_create ? `
        <div class="row">
          <div><label>Çalışan no</label><input id="emp-no" placeholder="MUH-2"></div>
          <div><label>Birim</label><select id="emp-dep">${lookupSecenekler(LOOKUPS.data.departments)}</select></div>
          <div><label>Unvan</label><select id="emp-pos">${lookupSecenekler(LOOKUPS.data.positions)}</select></div>
          <div><label>İşe giriş</label><input id="emp-hire" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>
          <div><label>Bağlanacak kullanıcı (opsiyonel)</label>
            <select id="emp-user"><option value="">(hesap bağlama)</option>
              ${LOOKUPS.data.users.map((u) => `<option value="${esc(u.id)}">${esc(u.email)}${u.bagli_employee_no ? " — bağlı: " + esc(u.bagli_employee_no) : ""}</option>`).join("")}
            </select></div>
          <div><button class="primary" id="emp-create">Oluştur</button></div>
        </div>
        ${LOOKUPS.meta.can_manage_positions ? `

  async function calisanDetay(calisanId) {
    let veri;
    try {
      veri = await PERSOPYRO_UI.cagir(`/test-ui/api/employees/${calisanId}`);
    } catch (hata) { PERSOPYRO_UI.mesaj("error", hata.message); return; }
    const c = veri.data;
    const bakiyeler = (c.balances || []).length
      ? `<table><thead><tr><th>Tür</th><th>Hakediş</th><th>Kullanılan</th><th>Bekleyen</th><th>Kalan</th></tr></thead><tbody>
         ${c.balances.map((b) => `<tr><td>${esc(b.leave_type)}</td><td>${esc(b.entitled_days)}</td>
           <td>${esc(b.used_days)}</td><td>${esc(b.reserved_days)}</td>
           <td><strong>${esc(b.available_days)}</strong></td></tr>`).join("")}</tbody></table>`
      : `<p class="muted">Bu dönem için bakiye kaydı yok.</p>`;

    let yetkiBolumu = `<p class="muted">Rol/yetki bölümünü görmek için <code>role.manage</code> izni
      (şirket yöneticisi) gerekir.</p>`;
    if (c.yetki_gorunur) {
      const rolSatirlari = c.roles.length
        ? c.roles.map((r) => `<tr>
            <td>${esc(r.name)} <div class="muted small"><code>${esc(r.code)}</code></div></td>
            <td>${esc(r.scope_text)}</td>
            <td>${esc(r.granted_at ? r.granted_at.slice(0, 10) : "")}</td>
            <td>${c.is_self ? "<span class='muted'>kendi atamanız</span>"
              : `<button class="danger" data-revoke="${esc(r.id)}">Rolü kaldır</button>`}</td>
          </tr>`).join("")
        : `<tr><td colspan="4" class="muted">Etkin rol ataması yok.</td></tr>`;
      const kaldirilanlar = (c.revoked_assignments || []).length
        ? `<h4>Kaldırılmış atamalar</h4><table><thead><tr><th>Rol</th><th>Kapsam</th><th>Kaldırılma</th><th></th></tr></thead><tbody>
           ${c.revoked_assignments.map((r) => `<tr><td>${esc(r.name)}</td><td>${esc(r.scope_text)}</td>
             <td>${esc((r.deleted_at || "").slice(0, 10))}</td>
             <td><button data-restore="${esc(r.id)}">Geri al</button></td></tr>`).join("")}</tbody></table>`
        : "";
      const istisnalar = (c.permission_overrides || []).length
        ? `<h4>İzin istisnaları (salt okunur)</h4><table><thead><tr><th>İzin</th><th>Etki</th><th>Gerekçe</th></tr></thead><tbody>
           ${c.permission_overrides.map((i) => `<tr><td><code>${esc(i.permission)}</code> ${esc(i.permission_name)}</td>
             <td>${esc(i.effect_label)}</td><td>${esc(i.reason)}</td></tr>`).join("")}</tbody></table>`
        : `<p class="muted">İzin istisnası (override) yok.</p>`;
      const rolSecenekleri = c.assignable_roles.map((r) => r.atanabilir
        ? `<option value="${esc(r.id)}" data-kapsam="${r.kapsam_gerekli ? "1" : "0"}">${esc(r.name)} — ${esc(r.scope_type_label)}</option>`
        : `<option value="${esc(r.id)}" disabled>${esc(r.name)} — atanamaz (${esc(r.gerekce)})</option>`).join("");
      yetkiBolumu = `
        <h3>Rol ve Yetkiler</h3>
        ${c.is_self ? `<p class="muted">Kendi rol atamalarınızı değiştiremezsiniz (self-elevation yasağı).</p>` : ""}
        <table><thead><tr><th>Rol</th><th>Kapsam</th><th>Verilme</th><th></th></tr></thead>
          <tbody>${rolSatirlari}</tbody></table>
        ${c.user_email ? `
          <h4>Rol ata</h4>
          <div class="row">
            <div><label>Rol</label><select id="rol-secim">${rolSecenekleri || '<option value="">(atanabilir rol yok)</option>'}</select></div>
            <div><label>Birim kapsamı (UNIT roller için zorunlu)</label>
              <select id="rol-kapsam">${lookupSecenekler(TREE, "")}</select></div>
            <div><label>Gerekçe</label><input id="rol-gerekce" placeholder="Örn. Finans müdürlüğü"></div>
            <div><button class="primary" id="rol-ata">Rolü ata</button></div>
          </div>
          <p class="muted small">Kapsam zorunluluğu role göre sunucuda dayatılır; kullanıcı kendi rolünü
            yükseltemez, sahip olmadığı yetkiyi dağıtamaz.</p>` : `<p class="muted">Bu çalışana bağlı kullanıcı hesabı yok.</p>`}
        ${kaldirilanlar}
        <h4>Etkin izinler (${c.effective_permissions.length})</h4>
        <p class="muted small">${c.effective_permissions.map((p) => `<code>${esc(p)}</code>`).join(" ")}</p>
        ${istisnalar}`;
    }

    document.getElementById("employee-detail").innerHTML = `
      <div class="detail-box">
        <h2>${esc(c.user_name || c.employee_no)} <span class="muted">(${esc(c.employee_no)})</span></h2>
        <div class="grid">
          <div><h3>Birim</h3>${esc(c.department) || yok}</div>
          <div><h3>Unvan</h3>${esc(c.position) || yok}</div>
          <div><h3>Yönetici</h3>${c.manager ? esc(c.manager.employee_no) + (c.manager.name ? " · " + esc(c.manager.name) : "") : yok}</div>
          <div><h3>Durum</h3>${esc(c.status_label || c.status)}</div>
          <div><h3>İşe giriş</h3>${esc(c.hire_date) || yok}</div>
        </div>
        <h3>Yıllık izin</h3><p class="hakedis-buyuk">${yillikSatir(c.annual)}</p>
        ${bakiyeler}
        ${yetkiBolumu}
      </div>`;

    document.querySelectorAll("[data-revoke]").forEach((d) =>
      d.addEventListener("click", () => rolKaldir(d.dataset.revoke, calisanId)));
    document.querySelectorAll("[data-restore]").forEach((d) =>
      d.addEventListener("click", () => rolGeriAl(d.dataset.restore, calisanId)));
    const ata = document.getElementById("rol-ata");
    if (ata) ata.addEventListener("click", () => rolAta(calisanId));
    const secim = document.getElementById("rol-secim");
    if (secim) secim.addEventListener("change", () => {
      const opt = secim.selectedOptions[0];
      document.getElementById("rol-kapsam").disabled = !(opt && opt.dataset.kapsam === "1");
    });
  }

  async function rolAta(calisanId) {
    const rol = document.getElementById("rol-secim");
    const kapsam = document.getElementById("rol-kapsam");
    try {
      await PERSOPYRO_UI.cagir(`/test-ui/api/employees/${calisanId}/roles`, { method: "POST", body: {
        role_id: rol.value,
        scope_org_unit_id: kapsam && !kapsam.disabled ? (kapsam.value || null) : null,
        reason: document.getElementById("rol-gerekce").value.trim(),
      }});
      PERSOPYRO_UI.mesaj("ok", "Rol atandı.");
      await Promise.all([calisanDetay(calisanId), yukleCalisanlar()]);
    } catch (hata) { PERSOPYRO_UI.mesaj("error", hata.message); }
  }

  async function rolKaldir(atamaId, calisanId) {
    const onay = await onayModali("Rolü kaldır",
      `<p>Bu rol atamasını kaldırmak istiyor musunuz?</p>
       <label>Gerekçe</label><input id="rol-kaldir-gerekce" placeholder="Örn. görev değişikliği">`, "Kaldır");
    if (!onay) return;
    try {
      await PERSOPYRO_UI.cagir(`/test-ui/api/role-assignments/${atamaId}/revoke`, {
        method: "POST", body: { reason: document.getElementById("rol-kaldir-gerekce").value.trim() }});
      PERSOPYRO_UI.mesaj("ok", "Rol ataması kaldırıldı (soft delete, OD21).");
      await Promise.all([calisanDetay(calisanId), yukleCalisanlar()]);
    } catch (hata) { PERSOPYRO_UI.mesaj("error", hata.message); }
  }

  async function rolGeriAl(atamaId, calisanId) {
    try {
      await PERSOPYRO_UI.cagir(`/test-ui/api/role-assignments/${atamaId}/restore`, {
        method: "POST", body: { reason: "test arayüzü geri alma" }});
      PERSOPYRO_UI.mesaj("ok", "Rol ataması geri alındı.");
      await Promise.all([calisanDetay(calisanId), yukleCalisanlar()]);
    } catch (hata) { PERSOPYRO_UI.mesaj("error", hata.message); }
  }

        <p class="muted">Bu liste yalnızca arayüz kolaylığı içindir;
          <strong>tek güvenlik kontrolü değildir</strong>.</p>
      </div>`;
    document.querySelectorAll("[data-yetki]").forEach((d) =>
      d.addEventListener("click", () => yetkiEditoru(d.dataset.yetki)));
  }

  async function yetkiEditoru(roleId) {
    const hedef = document.getElementById("yetki-editor");
    let veri;
    try {
      veri = await PERSOPYRO_UI.cagir(`/test-ui/api/roles/${roleId}/permissions`);
    } catch (hata) { PERSOPYRO_UI.mesaj("error", hata.message); return; }
    const r = veri.data.role;
    const kutular = veri.data.modules.map((m) => `
      <div class="modul">
        <label class="modul-baslik">
          <input type="checkbox" class="modul-tumu" data-modul="${esc(m.module)}">
          <strong>${esc(m.module_label)}</strong>
          <span class="muted small">${esc(m.permissions.length)} izin</span>
        </label>
        <div class="modul-izinler">
          ${m.permissions.map((p) => `<label class="izin-kutu">
            <input type="checkbox" class="izin-secim" value="${esc(p.code)}"
              data-modul="${esc(m.module)}"${p.secili ? " checked" : ""}
              ${p.aktor_sahip ? "" : " disabled"}>
            <span>${esc(p.name)} <code>${esc(p.code)}</code></span>
            ${p.aktor_sahip ? "" : '<span class="muted small">(sizde yok — dağıtamazsınız)</span>'}
          </label>`).join("")}
        </div>
      </div>`).join("");

    hedef.innerHTML = `
      <div class="card">
        <h2>${esc(r.name)} — yetkiler</h2>
        <p class="muted">${esc(r.name)} (<code>${esc(r.code)}</code>) · kapsam:
          ${esc(r.scope_type_label)} · seçili ${esc(veri.data.selected_count)} /
          ${esc(veri.data.total_count)} izin</p>
        ${veri.data.can_edit ? "" : `<p class="muted">Bu rolü düzenleyemezsiniz
          (yetkiniz yok ya da bu rol kendinizde etkin — self-elevation yasağı).</p>`}
        <p>
          <label class="small"><input type="checkbox" id="izin-tumu"> <strong>Tümünü seç</strong></label>
        </p>
        ${kutular}
        ${veri.data.can_edit ? `
        <div class="row" style="margin-top:12px">
          <div><label>Gerekçe</label><input id="yetki-gerekce" placeholder="Örn. departman yöneticisi onay yetkisi alsın"></div>
          <div><button class="primary" id="yetki-kaydet">Yetkileri kaydet</button></div>
        </div>` : ""}
        <p class="muted small">Platform izinleri bu ekranda yönetilmez (OD3); sahip
          olmadığınız izinleri dağıtamazsınız; rol en az bir izin içermelidir.</p>
      </div>`;

    const tumu = document.getElementById("izin-tumu");
    const secimler = () => [...document.querySelectorAll(".izin-secim:not([disabled])")];
    if (tumu) {
      tumu.checked = secimler().length > 0 && secimler().every((c) => c.checked);
      tumu.addEventListener("change", () => secimler().forEach((c) => { c.checked = tumu.checked; }));
    }
    document.querySelectorAll(".modul-tumu").forEach((m) => {
      const grup = () => [...document.querySelectorAll(`.izin-secim[data-modul="${m.dataset.modul}"]:not([disabled])`)];
      m.checked = grup().length > 0 && grup().every((c) => c.checked);
      m.addEventListener("change", () => grup().forEach((c) => { c.checked = m.checked; }));
    });
    const kaydet = document.getElementById("yetki-kaydet");
    if (kaydet) kaydet.addEventListener("click", async () => {
      const kodlar = [...document.querySelectorAll(".izin-secim:checked")].map((c) => c.value);
      if (!kodlar.length) { PERSOPYRO_UI.mesaj("error", "En az bir izin seçmelisiniz."); return; }
      try {
        await PERSOPYRO_UI.cagir(`/test-ui/api/roles/${roleId}/permissions`, {
          method: "POST",
          body: {
            permission_codes: kodlar,
            reason: document.getElementById("yetki-gerekce").value.trim(),
          },
        });
        PERSOPYRO_UI.mesaj("ok", "Rol yetkileri güncellendi.");
        // Kaydettikten sonra düzenleyici açık kalır ve güncel durumu gösterir.
        await Promise.all([yukleYetki(), yuklePanel()]);
        await yetkiEditoru(roleId);
      } catch (hata) { PERSOPYRO_UI.mesaj("error", hata.message); }
    });
  }

  function yukleOzet() {
    const k = ME.data;
    document.getElementById("tab-raw").innerHTML = `
      <div class="card"><h1>Kapsam ve yetki (oturumdaki kullanıcı)</h1>
        <div class="grid">
          <div><h3>Roller</h3>${k.roles.map((r) => `<span class="pill">${esc(r.name)}</span>`).join(" ") || "—"}
            <div class="muted small">${k.roles.map((r) => esc(r.code)).join(", ")}</div></div>
          <div><h3>Kapsam</h3><pre>${esc(bos(k.scope))}</pre></div>
          <div><h3>Çalışan</h3><pre>${esc(bos(k.employee))}</pre></div>
        </div>
        <h3>Etkin izinler (${k.permissions.length})</h3>
        <p>${k.permissions.map((p) => `<code>${esc(p)}</code>`).join(" ")}</p>
        <p class="muted">Bu liste yalnızca arayüz kolaylığı içindir; <strong>tek güvenlik kontrolü değildir</strong>.</p>
      </div>`;
  }

  // --- Ortak ---------------------------------------------------------------
  async function yukleLookups() {
    LOOKUPS = await PERSOPYRO_UI.cagir("/test-ui/api/lookups");
  }

  const YUKLEYICILER = {
    panel: yuklePanel,
    departments: yukleDepartmanlar,
    employees: yukleCalisanlar,
    leave: yukleIzin,
    approvals: yukleOnaylar,
    raw: yukleYetki,
  };

  async function sekmeAc(ad) {
    document.querySelectorAll(".tabs button").forEach((b) =>
      b.classList.toggle("active", b.dataset.tab === ad));
    Object.keys(YUKLEYICILER).forEach((k) => {
      document.getElementById("tab-" + k).hidden = k !== ad;
    });
    try {
      await YUKLEYICILER[ad]();
    } catch (hata) { PERSOPYRO_UI.mesaj("error", hata.message); }
  }

  document.querySelectorAll(".tabs button").forEach((b) =>
    b.addEventListener("click", () => sekmeAc(b.dataset.tab)));

  (async () => {
    try {
      ME = await PERSOPYRO_UI.cagir("/test-ui/api/me");
      await yukleLookups();
      await sekmeAc("panel");
    } catch (hata) {
      PERSOPYRO_UI.mesaj("error", hata.message);
      if (hata.code === "not_authenticated") window.location.replace("/test-ui/login/");
    }
  })();
</script>
{% endblock %}
